# cargo-deny policy for both lockfiles (root workspace and desktop/src-tauri).
# `cargo deny --manifest-path <Cargo.toml> check` runs in CI.

[advisories]
version = 2
# Advisories we have looked at and accepted. Each needs a reason and a date.
ignore = [
    # 2026-10-20: proc-macro-error is unmaintained. It is only pulled in by Tauri's Linux GTK3 bindings
    # (glib-macros 0.18), so it is not compiled into the Windows build. Upstream issue (gtk-rs / Tauri);
    # re-check when Tauri moves off GTK3.
    { id = "RUSTSEC-2024-0370", reason = "unmaintained, only via Tauri's Linux GTK3 stack" },
    # 2026-10-23: proc-macro-error2 is unmaintained and has no safe upgrade. It is a compile-time proc-macro only
    # (hax-lib-macros, from the formal-verification annotations in libcrux, which hpke-rs uses), reached through
    # openmls (ADR 0025, crate `spike-mls`). It is not in the compiled program. Re-check when openmls or hpke-rs move.
    { id = "RUSTSEC-2026-0173", reason = "unmaintained compile-time proc-macro, only via openmls -> hpke-rs -> libcrux" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# Permissive licences only. Anything else must be reviewed and added here with a reason.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    # webpki-roots: the Mozilla CA certificate bundle, published as data under a permissive data licence.
    "CDLA-Permissive-2.0",
]

# MPL-2.0 is file-level (weak) copyleft: fine for unmodified dependencies, but a licensing choice, so each
# crate is named here rather than allowing the licence everywhere. All five come from Tauri's HTML/CSS tooling
# or its directory helper. Review with the licence decision (docs/HANDOFF.md).
exceptions = [
    { allow = ["MPL-2.0"], crate = "cssparser" },
    { allow = ["MPL-2.0"], crate = "cssparser-macros" },
    { allow = ["MPL-2.0"], crate = "dtoa-short" },
    { allow = ["MPL-2.0"], crate = "option-ext" },
    { allow = ["MPL-2.0"], crate = "selectors" },
    # 2026-10-23: hpke-rs (the HPKE implementation behind openmls, both its RustCrypto and libcrux providers) is
    # MPL-2.0. Provisional: added with ADR 0025 slice 1 so the build and CI stay checkable, and it needs the same
    # review as the entries above, because it is a property of using openmls at all. File-level copyleft: fine to
    # use unmodified in any licence; changes to these files themselves would have to be published.
    { allow = ["MPL-2.0"], crate = "hpke-rs" },
    { allow = ["MPL-2.0"], crate = "hpke-rs-crypto" },
    { allow = ["MPL-2.0"], crate = "hpke-rs-rust-crypto" },
]

# Our own crates are `publish = false` and carry no licence yet (no LICENSE file on purpose:
# the licence is an open decision, see docs/HANDOFF.md).
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
