[workspace]
resolver = "2"
members = ["core", "relay", "cli", "mls"]
# The desktop app has its own workspace (webview toolchain); build it with `cargo build` in desktop/src-tauri.
exclude = ["desktop"]

[workspace.package]
version = "0.0.1"
edition = "2021"
publish = false

[profile.release]
overflow-checks = true

# Optimise dependencies even in dev builds so Argon2 and the ratchet are fast in tests.
[profile.dev.package."*"]
opt-level = 3
