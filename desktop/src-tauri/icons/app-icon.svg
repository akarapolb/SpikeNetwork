  <g transform="translate(194 194) scale(26.5)" fill="none" stroke="#2FEBD3" stroke-width="3.4" stroke-linecap="round">
    <path d="M17.6 6.3A8.2 8.2 0 1 0 17.6 17.7"/>
    <circle cx="19.6" cy="12" r="3" fill="#2FEBD3" stroke="none"/>
  </g>
</svg>
