[package]
name = "spike-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Spike Connect command-line client"

[lib]
name = "spike_cli"

[[bin]]
name = "spike"
path = "src/main.rs"

[features]
# Lets tests make commits the honest API refuses to, to show every member refuses them too.
test-hooks = ["spike-mls/test-hooks"]

[dependencies]
rand = "0.8"
spike-core = { path = "../core" }
spike-mls = { path = "../mls" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
rpassword = "7"
zeroize = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
webpki-roots = "1.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }

[dev-dependencies]
spike-cli = { path = ".", features = ["test-hooks"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
rustls-pki-types = "1"
spike-relay = { path = "../relay" }

# Only for examples/relay_check.rs (asks a TURN server for an allocation).
turn = "0.17"
webrtc-util = "0.17"
