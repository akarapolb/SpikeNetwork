[package]
name = "spike-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Spike Connect command-line client"

[lib]
name = "spike_cli"

[[bin]]
name = "spike"
path = "src/main.rs"

[dependencies]
spike-core = { path = "../core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"

[dev-dependencies]
spike-relay = { path = "../relay" }
