[package]
name = "spike-relay"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Spike Network relay: authenticated store-and-forward for ciphertext"

[lib]
name = "spike_relay"

[[bin]]
name = "spike-relay"
path = "src/main.rs"

[dependencies]
spike-core = { path = "../core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"
serde_json = "1"
hex = "0.4"
rand = "0.8"
clap = { version = "4", features = ["derive", "env"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
webpki-roots = "1.0"

# Only for the test TURN server in examples/ (a stand-in for coturn that checks the same credentials).
[dev-dependencies]
turn = "0.17"
webrtc-util = "0.17"
base64 = "0.22"
