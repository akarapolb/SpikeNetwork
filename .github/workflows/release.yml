name: Desktop release

# Builds, signs and publishes the desktop app for Windows and Linux when a version tag is pushed
# (tag v<version>, matching desktop/src-tauri/tauri.conf.json). The release carries the installers and
# latest.json, which the app's automatic updates read (docs/desktop-release.md).
#
# Needs the repository secret TAURI_SIGNING_PRIVATE_KEY (and TAURI_SIGNING_PRIVATE_KEY_PASSWORD if the key
# has one): without it the updater packages are not signed and the build fails on purpose.
# Windows Authenticode signing is optional (WINDOWS_CERTIFICATE and WINDOWS_CERTIFICATE_PASSWORD).
#
# A manual run (workflow_dispatch) builds and uploads the packages as run artifacts only; it publishes nothing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            platform: windows
          - os: ubuntu-24.04
            bundles: deb,appimage
            platform: linux
    runs-on: ${{ matrix.os }}
    env:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: desktop/src-tauri
      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Import the Windows code-signing certificate (only if provided)
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $pw = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $c = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
          Remove-Item $pfx
          '{"bundle":{"windows":{"certificateThumbprint":"' + $c.Thumbprint + '","digestAlgorithm":"sha256","timestampUrl":"http://timestamp.digicert.com"}}}' | Out-File -Encoding ascii signing.conf.json
      - name: Build and sign the packages
        working-directory: desktop/src-tauri
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          args="--bundles ${{ matrix.bundles }} --config tauri.updater.conf.json"
          if [ -f signing.conf.json ]; then args="$args --config signing.conf.json"; fi
          cargo tauri build $args
      - name: Name the packages for the release
        working-directory: desktop/src-tauri
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./tauri.conf.json').version")
          mkdir -p "$RUNNER_TEMP/stage"
          if [ "${{ matrix.platform }}" = "windows" ]; then
            src=$(ls target/release/bundle/nsis/*-setup.exe)
            cp "$src" "$RUNNER_TEMP/stage/spike-connect-$version-windows-x64.exe"
            cp "$src.sig" "$RUNNER_TEMP/stage/spike-connect-$version-windows-x64.exe.sig"
          else
            src=$(ls target/release/bundle/appimage/*.AppImage)
            cp "$src" "$RUNNER_TEMP/stage/spike-connect-$version-linux-x86_64.AppImage"
            cp "$src.sig" "$RUNNER_TEMP/stage/spike-connect-$version-linux-x86_64.AppImage.sig"
            cp target/release/bundle/deb/*.deb "$RUNNER_TEMP/stage/spike-connect-$version-linux-amd64.deb"
          fi
          ls -l "$RUNNER_TEMP/stage"
      - name: Keep the packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spike-connect-${{ matrix.platform }}
          path: ${{ runner.temp }}/stage/*
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: ${{ runner.temp }}/packages
          merge-multiple: true
      - name: Write latest.json (the update manifest)
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: node scripts/make-update-manifest.mjs "$RUNNER_TEMP/packages" "$REPO" "$TAG" "$RUNNER_TEMP/packages/latest.json"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/packages"
          # Updater packages and their signatures are read by the app; the installers are for first installs.
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Spike Connect $TAG" --generate-notes \
            latest.json spike-connect-*
