name: Windows installer (manual)

# Builds the desktop app's per-user NSIS installer. Run it by hand from the Actions tab.
# The result is UNSIGNED (Windows SmartScreen will warn) and is not published anywhere:
# it is an artifact of this run. Signing and an update channel come before any release.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nsis:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: desktop/src-tauri
      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build the installer
        working-directory: desktop/src-tauri
        run: cargo tauri build --bundles nsis
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spike-connect-windows-installer-unsigned
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
