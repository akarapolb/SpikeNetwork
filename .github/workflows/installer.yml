name: Windows installer (manual)

# Builds the desktop app's per-user NSIS installer. Run it by hand from the Actions tab.
# The result is UNSIGNED (Windows SmartScreen will warn) and is not published anywhere:
# it is an artifact of this run. Signing and an update channel come before any release.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nsis:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: desktop/src-tauri
      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build the installer
        working-directory: desktop/src-tauri
        run: cargo tauri build --bundles nsis
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spike-connect-windows-installer-unsigned
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
