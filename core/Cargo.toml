[package]
name = "spike-core"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Spike Connect core: device identity, ratcheting sessions, relay wire protocol"

[dependencies]
vodozemac = "0.11"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
argon2 = "0.5"
chacha20poly1305 = "0.10"
zeroize = "1"
rand = "0.8"
hmac = "0.12"
sha1 = "0.10"
hkdf = "0.13"
