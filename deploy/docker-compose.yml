# A Spike relay with HTTPS (Caddy) and a TURN server (coturn) for calls between different networks.
# Run from this folder:   cp .env.example .env   (edit it)   then   docker compose up -d --build
services:
  relay:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      SPIKE_RELAY_TURN_SECRET: ${TURN_SECRET:?set TURN_SECRET in .env}
    command:
      - --listen=0.0.0.0:8787
      - --insecure-no-tls              # Caddy in front terminates TLS
      - --db=/data/relay.db
      - --trusted-proxy=172.16.0.0/12  # Caddy on the Docker network, so every client keeps its own rate limit
      - --auth-audience=${DOMAIN:?set DOMAIN in .env}
      - --turn-url=turn:${DOMAIN}:3478?transport=udp
      - --turn-url=turn:${DOMAIN}:3478?transport=tcp
    volumes:
      - relay-data:/data
    expose:
      - "8787"

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - relay

  # Forwards encrypted call packets when two devices cannot reach each other directly. It cannot hear or see a call.
  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    network_mode: host
    command:
      - -n
      - --log-file=stdout
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET}
      - --realm=${DOMAIN}
      - --listening-port=3478
      - --external-ip=${PUBLIC_IP}
      - --min-port=49160
      - --max-port=49200
      - --fingerprint
      - --no-tls
      - --no-dtls
      - --no-cli
      - --no-multicast-peers
      - --user-quota=4
      - --total-quota=200
      - --max-bps=3000000
      # Calls only: never relay into the server's own network.
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255

volumes:
  relay-data:
  caddy-data:
